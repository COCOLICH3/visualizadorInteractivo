<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Visualizador de Música — Spike</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: system-ui, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    #bar {
      height: 60px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 16px;
    }
    #start {
      padding: 10px 22px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: #6c5ce7;
      color: #fff;
      font-weight: 600;
    }
    #start:hover { background: #5b4bd6; }
    #status { font-size: 14px; opacity: 0.85; }
    #level {
      margin-left: auto;
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      opacity: 0.7;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="bar">
    <button id="start">▶ Iniciar captura</button>
    <span id="status">Listo. Reproducí música en la PC y hacé click para capturar.</span>
    <span id="level">nivel: --</span>
  </div>
  <canvas id="viz"></canvas>
  <script src="renderer.js"></script>
</body>
</html>
